# Builds NSW-Home release packages (Windows and macOS) from this repository's source.
# - Every push and pull request: build only (the files are kept as workflow artifacts).
# - A tag like v0.2.0: build and attach the files to that tag's GitHub release.
# Building here, not on a personal PC, is what lets a code-signing service vouch
# that the signed file is exactly what this source produces.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build NSW-Home.exe
        shell: cmd
        run: call build.bat

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\NSW-Home.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: NSW-Home-windows
          path: |
            build/NSW-Home.exe
            build/NSW-Home-Setup.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME --title "NSW-Home $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME build/NSW-Home.exe build/NSW-Home-Setup.exe --clobber

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake pkg-config sdl2 cairo freetype fontconfig jpeg-turbo

      - name: Build and test NSW-Home
        run: |
          cmake -S . -B build/unix -DCMAKE_BUILD_TYPE=Release
          cmake --build build/unix -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build/unix --output-on-failure

      - name: Package NSW-Home.app and DMG
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0"
          fi
          chmod +x installer/package_macos.sh
          ./installer/package_macos.sh "$VER" build/unix build

      - uses: actions/upload-artifact@v4
        with:
          name: NSW-Home-macos-arm64
          path: build/NSW-Home-macos-arm64.dmg

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "NSW-Home ${GITHUB_REF_NAME#v}" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" build/NSW-Home-macos-arm64.dmg --clobber
